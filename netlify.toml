# netlify.toml - forza Node 20 e stampa diagnostica
[build]
  node_version = "20"
  # Sostituisci "npm run build" con il tuo comando di build se diverso
  command = "node -v && echo '--- repo root files ---' && ls -la && npm run build"
  # Sostituisci publish con la cartella di output corretta (vedi esempi sotto)
  publish = "build"

[context.production.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"












