# netlify.toml - forza Node.js 20 per la build e stampa la versione per diagnostica
[build]
  node_version = "20"
  publish = "build"
  command = "node -v && npm run build"

# Impostazioni per l'ambiente di produzione (opzionale, ridondante con node_version)
[context.production.environment]
  NODE_VERSION = "20"

# Se usi funzioni serverless e vuoi essere esplicito
[functions]
  # se usi bundler specifico, ad esempio esbuild; altrimenti rimuovi questa sezione
  node_bundler = "esbuild"











